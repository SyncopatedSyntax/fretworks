<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0e17" />

    <!-- ── UPDATE these three URLs once you have a real domain ── -->
    <title>Fretworks — free guitar fretboard trainers by SyncopatedSyntax</title>
    <meta name="description" content="A growing set of free, mobile-first fretboard trainers for chords, scales, and harmony — colour-coded by what each note does. No sign-up. Works offline. Built by Zak at SyncopatedSyntax." />
    <link rel="canonical" href="https://fretworks.vercel.app/" />

    <!-- Open Graph (iMessage, Discord, WhatsApp, LinkedIn, Facebook) -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="Fretworks" />
    <meta property="og:title"       content="Fretworks — free guitar fretboard trainers" />
    <meta property="og:description" content="Colour-coded trainers for chords, scales, and harmony. Free, mobile-first, works offline. No sign-up." />
    <meta property="og:url"         content="https://fretworks.vercel.app/" />
    <meta property="og:image"       content="https://fretworks.vercel.app/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Fretworks — free guitar fretboard trainers" />
    <meta name="twitter:description" content="Colour-coded trainers for chords, scales, and harmony. Free, mobile-first, works offline." />
    <meta name="twitter:image"       content="https://fretworks.vercel.app/og-image.png" />

    <!-- PWA / install -->
    <link rel="manifest"        href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable"          content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"            content="Fretworks" />

    <!-- Fonts (preconnect first, then stylesheet) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"  href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;0,700;1,600&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" />

    <style>html,body,#root{margin:0;background:#0f0e17;}</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
